[package]
name = "vivid_protocol"
version = "1.5.9"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Wire types, state models, and deterministic codecs for Vivid Protocol 1.5"
readme = "README.md"
repository = "https://github.com/vivido-dev/vivid_protocol"
documentation = "https://docs.rs/vivid_protocol"
keywords = ["terminal", "graphics", "media", "protocol", "cbor"]
categories = ["encoding", "multimedia", "network-programming"]
include = [
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "benches/**/*.rs",
  "src/**/*.rs",
  "vivid-protocol-1.5-*.md",
  "vivid-protocol-1.5-registry.toml",
]

[features]
default = ["native"]
native = ["native-transport"]
native-transport = []

[dependencies]
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
zrip = { version = "0.8.21", default-features = false, features = ["std", "simd"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"

# rayon and plotters do not build for WASI.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "stage0"
harness = false
required-features = ["native"]

[[bench]]
name = "raster_zstd"
harness = false

# The §7 model checker explores ~10^6 composed states and must stay a practical part of
# `cargo test`. opt-level 1 keeps debug assertions and cheap incremental builds while bringing
# the exploration back to seconds.
[profile.dev]
opt-level = 1
