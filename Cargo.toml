[package]
name = "vivid_protocol"
version = "1.4.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Wire types and deterministic codecs for the Vivid terminal media protocol"
readme = "README.md"
repository = "https://github.com/vivido-dev/vivid_protocol"
documentation = "https://docs.rs/vivid_protocol"
keywords = ["terminal", "graphics", "media", "protocol", "cbor"]
categories = ["encoding", "multimedia", "network-programming"]
include = ["Cargo.toml", "README.md", "src/**/*.rs"]

[features]
default = ["native"]
native = ["dep:zstd", "dep:zstd-safe"]

[dependencies]
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
zstd = { version = "0.13", optional = true }
zstd-safe = { version = "7.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.8"
