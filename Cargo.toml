[package]
name = "vivid_protocol"
version = "1.5.11"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
description = "Wire types, state models, and deterministic codecs for Vivid Protocol 1.5"
readme = "README.md"
repository = "https://github.com/vivido-dev/vivid_protocol"
documentation = "https://docs.rs/vivid_protocol"
keywords = ["terminal", "graphics", "media", "protocol", "cbor"]
categories = ["encoding", "multimedia", "network-programming"]
include = [
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "benches/**/*.rs",
  "src/**/*.rs",
  "vivid-protocol-1.5-*.md",
  "vivid-protocol-1.5-registry.toml",
]

[features]
default = ["native"]
native = ["native-transport", "dep:zstd", "dep:zstd-safe"]
native-transport = []

[dependencies]
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
zstd = { version = "0.14", optional = true }
zstd-safe = { version = "8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.9"

[[bench]]
name = "stage0"
harness = false
required-features = ["native"]

# The §7 model checker explores ~10^6 composed states and must stay a practical part of
# `cargo test`. opt-level 1 keeps debug assertions and cheap incremental builds while bringing
# the exploration back to seconds.
[profile.dev]
opt-level = 1

# Pragmatic Rust Guidelines lint set (M-STATIC-VERIFICATION); opt-outs carry their reason.
[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Open documentation finding (docs/RUST-GUIDELINES-REVIEW.md): about 350 fallible public
# functions still lack the `# Errors` / `# Panics` sections these lints require.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Open typed-error finding (docs/RUST-GUIDELINES-REVIEW.md): codecs report malformed input as a
# fresh, labelled error and deliberately drop the integer-conversion error that detected it.
map_err_ignore = "allow"
# `Result`-returning APIs are already `#[must_use]`; marking every pure accessor adds noise
# without catching real misuse in a codec crate.
must_use_candidate = "allow"
# Codec functions walk spec field tables in order; splitting them scatters that order.
too_many_lines = "allow"
